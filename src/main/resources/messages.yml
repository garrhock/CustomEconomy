# Shards messages — MiniMessage. Tokens: {amount} {balance} {player} {victim}
prefix: "<dark_gray>[<aqua>⧫</aqua>]</dark_gray> "
balance: "<gray>Shards</gray> <dark_gray>»</dark_gray> <aqua>{balance} ⧫</aqua>"
actionbar-kill: "<aqua><bold>+{amount} ⧫</bold></aqua> <dark_gray>—</dark_gray> <white>{victim}</white>"
actionbar-earned: "<aqua><bold>+{amount} ⧫</bold></aqua>"
actionbar-cooldown: "<gray>no shards — you killed {victim} too recently</gray>"
admin-given: "<green>Gave <aqua>{amount} ⧫</aqua> to {player}. New balance: <aqua>{balance} ⧫</aqua>"
admin-taken: "<green>Took <aqua>{amount} ⧫</aqua> from {player}. New balance: <aqua>{balance} ⧫</aqua>"
admin-set: "<green>Set {player} to <aqua>{balance} ⧫</aqua>"
admin-insufficient: "<red>{player} only has <aqua>{balance} ⧫</aqua>"
admin-usage: "<yellow>/shardsadmin <give|take|set|reload> <player> <amount>"
admin-player-online: "<red>Player must be online: {player}"
reloaded: "<green>Shards config + messages reloaded."
player-only: "<red>Only players can use this command."
shop-confirm: "<yellow>Buy</yellow> {item} <yellow>for <aqua>{cost} ⧫</aqua>? Click it again to confirm.</yellow>"
shop-bought: "<green>Bought</green> {item} <green>for <aqua>{cost} ⧫</aqua> — balance: <aqua>{balance} ⧫</aqua>"
shop-insufficient: "<red>You need <aqua>{cost} ⧫</aqua> — you have <aqua>{balance} ⧫</aqua>"
