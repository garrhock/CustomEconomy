# ─────────────────────────────────────────────────────────────────────────────
#  CustomEconomy — Admin Shop Sections
#
#  buy-price rules:
#    • If omitted, the buy price is computed automatically:
#        buy_price = sell_price (from items.yml) × shop.buy-price-markup
#      This keeps buy and sell prices in sync — change the sell price in
#      items.yml and the shop buy price updates on the next /ecoadmin reload.
#    • Set buy-price explicitly only when:
#        (a) the item has no sell price in items.yml, OR
#        (b) you intentionally want to charge a premium above the markup.
#    • Items with no sell price and no buy-price are skipped with a warning.
#
#  Fields per item:
#    material     - Bukkit Material name (required)
#    display-name - label shown in the GUI (optional, defaults to material name)
#    quantity     - stack size per click (optional, defaults to 1)
#    buy-price    - explicit price override (optional, see rules above)
# ─────────────────────────────────────────────────────────────────────────────

sections:

  overworld:
    display-name: "Overworld"
    icon: GRASS_BLOCK
    items:
